[package]
name = "windrose"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Discover and assess every AI option on your Mac"
license = "MIT"
repository = "https://github.com/jandro/windrose"
readme = "README.md"
keywords = ["ai", "llm", "macos", "tui", "cli"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_mangen = "0.2"
color-eyre = "0.6"
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"

[profile.release]
lto = true
strip = true
